name: mapa_do_pet
description: Cadastro, localização e acompanhamento de animais em situação de rua.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Versões base escolhidas sem acesso ao pub.dev: rode `flutter pub upgrade --major-versions`
# e confira o `flutter pub outdated` na Fase 0 (tarefa T0-3).
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/markers/
